{% extends "coins/dashboard/base.html" %}{% block content %}<section class="panel"><h1>{{ title }}: {{ obj }}</h1>{% if can_edit %}<a class="button" href="{% url 'dashboard:coin_catalog:edit' kind obj.pk %}">ویرایش</a>{% endif %}{% if product_id %}<p><a class="button" href="/dashboard/products/{{ product_id }}/">قیمت، موجودی و تصاویر محصول مرتبط</a></p>{% endif %}<dl class="grid">{% for label,value in rows %}<div><dt>{{ label }}</dt><dd>{{ value|default_if_none:"—" }}</dd></div>{% endfor %}</dl></section>{% endblock %}
