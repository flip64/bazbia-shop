<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}مدیریت سکه‌ها | بازبیا{% endblock %}</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#1f2937;font:15px Tahoma,Arial;line-height:1.9}header{background:#059669;color:white;padding:18px 5%;display:flex;gap:20px;flex-wrap:wrap}a{color:#047857;text-decoration:none}header a{color:white}main{max-width:1250px;margin:24px auto;padding:0 18px}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:24px}aside,.panel{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:20px}aside a{display:block;margin:8px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.button,button{display:inline-block;background:#059669;color:white;border:0;border-radius:7px;padding:9px 17px;cursor:pointer;font:inherit}input:not([type=checkbox]),select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;max-width:100%}input[type=checkbox]{width:auto}select[multiple]{min-height:130px}.field{margin-bottom:20px}.field label{font-weight:bold;display:block}.help,.muted{font-size:13px;color:#64748b}.errorlist{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:480px}td,th{padding:12px;text-align:right;border-bottom:1px solid #e2e8f0;vertical-align:top}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}dl>div{padding:12px;border-bottom:1px solid #eee}dt{font-weight:bold;color:#64748b}img{max-width:200px;max-height:200px;object-fit:contain}.message{background:#ecfdf5;padding:12px}.search{display:flex;gap:8px;max-width:550px}h1{font-size:25px}h2{font-size:20px}@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}aside{display:flex;gap:12px;flex-wrap:wrap}aside a{margin:0}header{padding:14px}main{padding:0 12px}}
</style></head><body><header><strong>بازبیا · کاتالوگ و مدیریت سکه‌ها</strong><a href="/dashboard/">داشبورد اصلی</a><a href="{% url 'dashboard:coin_catalog:list' %}">کاتالوگ</a><a href="{% url 'admin:index' %}">ادمین</a></header><main>{% for message in messages %}<p class="message" role="status">{{ message }}</p>{% endfor %}<div class="layout"><aside>{% for section in sections %}<a href="{% url 'dashboard:coin_catalog:records' section.key %}">{{ section.label }}</a>{% endfor %}</aside><div>{% block content %}{% endblock %}</div></div></main></body></html>
