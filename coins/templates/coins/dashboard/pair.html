<div class="coin-pair"><figure class="coin-face">{% if pair.obverse %}{% if pair.obverse.image %}<img src="{{ pair.obverse.image.url }}" alt="روی {{ name }}" loading="lazy">{% else %}<img src="{{ pair.obverse.source_url }}" alt="روی {{ name }}" loading="lazy">{% endif %}{% else %}<div class="coin-empty-face">تصویر رو</div>{% endif %}<figcaption>رو{% if pair.obverse.issue %} · {{ pair.obverse.issue.year|default_if_none:"بدون تاریخ" }}{% endif %}</figcaption></figure><figure class="coin-face">{% if pair.reverse %}{% if pair.reverse.image %}<img src="{{ pair.reverse.image.url }}" alt="پشت {{ name }}" loading="lazy">{% else %}<img src="{{ pair.reverse.source_url }}" alt="پشت {{ name }}" loading="lazy">{% endif %}{% else %}<div class="coin-empty-face">تصویر پشت</div>{% endif %}<figcaption>پشت{% if pair.reverse.issue %} · {{ pair.reverse.issue.year|default_if_none:"بدون تاریخ" }}{% endif %}</figcaption></figure></div>
