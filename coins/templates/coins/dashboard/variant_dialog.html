{% if can_create_variant %}<dialog id="variant-dialog" aria-labelledby="variant-dialog-title" style="max-width:600px;width:calc(100% - 30px);border:1px solid #cbd8d0;border-radius:12px;padding:24px"><form id="quick-variant-form" action="{% url 'dashboard:coin_catalog:variant-create' %}?kind={{ kind }}" method="post">{% csrf_token %}<h2 id="variant-dialog-title">افزودن واریانت جدید</h2><p class="help">واریانت با موجودی صفر ساخته می‌شود؛ ورود موجودی از مدیریت انبار انجام می‌شود.</p><div class="field"><label for="quick-product">محصول مرتبط</label><div class="remote-picker" data-url="{% url 'dashboard:coin_catalog:variant-lookup' %}?kind={{ kind }}&amp;target=product" data-select="quick-product"><input type="search" aria-label="جستجوی محصول برای واریانت جدید" placeholder="نام محصول را جستجو کنید" autocomplete="off"><div class="picker-status muted" role="status" aria-live="polite"></div><div class="picker-results"></div><button class="button secondary picker-more" type="button" hidden>نتایج بیشتر</button><select id="quick-product" name="product" required><option value="">محصول را انتخاب کنید</option></select></div></div><div class="field"><label for="quick-sku">کد کالا (SKU)</label><input id="quick-sku" name="sku" maxlength="50" required></div><div class="field"><label for="quick-price">قیمت فروش (تومان)</label><input id="quick-price" name="price" type="number" min="0" step="1" required></div><div class="field"><label for="quick-discount">قیمت تخفیفی (اختیاری)</label><input id="quick-discount" name="discount_price" type="number" min="0" step="1"></div><div id="quick-variant-errors" class="errorlist" role="alert"></div><div class="actions"><button type="submit">ساخت و انتخاب واریانت</button><button class="button secondary" type="button" id="close-variant-dialog">انصراف</button></div></form></dialog>{% endif %}
<script>
(function(){
function pick(select,item){let option=Array.from(select.options).find(o=>o.value===String(item.id));if(!option){option=new Option(item.label,String(item.id));select.add(option);}option.textContent=item.label;select.value=String(item.id);select.dispatchEvent(new Event('change',{bubbles:true}));}
document.querySelectorAll('.remote-picker').forEach(function(box){const input=box.querySelector('input[type=search]'),results=box.querySelector('.picker-results'),status=box.querySelector('.picker-status'),more=box.querySelector('.picker-more'),select=document.getElementById(box.dataset.select);let timer,controller,page=1,sequence=0;
async function load(append){controller?.abort();controller=new AbortController();const seq=++sequence;status.textContent='در حال جستجو…';if(!append){page=1;results.replaceChildren();}more.hidden=true;try{const url=new URL(box.dataset.url,location.origin);url.searchParams.set('q',input.value);url.searchParams.set('page',page);const response=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}});if(!response.ok||!response.headers.get('content-type')?.includes('application/json'))throw Error('دسترسی یا دریافت اطلاعات ممکن نشد.');const data=await response.json();if(seq!==sequence)return;data.results.forEach(item=>{const button=document.createElement('button');button.type='button';button.className='button secondary';button.style.cssText='display:block;width:100%;text-align:right;margin:4px 0';button.textContent=item.label;button.addEventListener('click',()=>{controller.abort();sequence++;pick(select,item);results.replaceChildren();more.hidden=true;status.textContent='انتخاب شد: '+item.label;});results.append(button);});status.textContent=data.results.length?'یکی از نتایج را انتخاب کنید.':'موردی پیدا نشد.';more.hidden=!data.has_more;}catch(error){if(error.name!=='AbortError'&&seq===sequence)status.textContent=error.message;}}
input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();clearTimeout(timer);load(false);}});input.addEventListener('input',()=>{clearTimeout(timer);controller?.abort();sequence++;timer=setTimeout(()=>load(false),300);});input.addEventListener('focus',()=>{if(!results.children.length)load(false);});more.addEventListener('click',()=>{page++;load(true);});});
const dialog=document.getElementById('variant-dialog');if(!dialog)return;document.getElementById('open-variant-dialog').addEventListener('click',()=>dialog.showModal());document.getElementById('close-variant-dialog').addEventListener('click',()=>{if(!dialog.querySelector('button[type=submit]').disabled)dialog.close();});dialog.addEventListener('cancel',event=>{if(dialog.querySelector('button[type=submit]').disabled)event.preventDefault();});const form=document.getElementById('quick-variant-form'),errorBox=document.getElementById('quick-variant-errors');form.addEventListener('submit',async function(event){event.preventDefault();const button=form.querySelector('button[type=submit]');if(button.disabled)return;button.disabled=true;errorBox.textContent='';try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!response.headers.get('content-type')?.includes('application/json'))throw Error('دسترسی یا ثبت واریانت ممکن نشد.');const data=await response.json();if(!response.ok){errorBox.textContent=Object.values(data.errors||{}).flat().join('؛ ')||'ثبت واریانت انجام نشد.';return;}pick(document.getElementById('id_variant'),data);dialog.close();form.reset();}catch(error){errorBox.textContent=error.message;}finally{button.disabled=false;}});
})();
</script>
