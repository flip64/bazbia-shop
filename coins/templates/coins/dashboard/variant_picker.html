<div class="remote-picker" data-url="{% url 'dashboard:coin_catalog:variant-lookup' %}?kind={{ kind }}" data-select="{{ field.auto_id }}"><input type="search" aria-label="جستجوی واریانت با نام محصول یا SKU" placeholder="نام محصول یا کد SKU را جستجو کنید" autocomplete="off"><div class="picker-status muted" role="status" aria-live="polite"></div><div class="picker-results"></div><button class="button secondary picker-more" type="button" hidden>نتایج بیشتر</button>{{ field }}</div>{% if can_create_variant %}<button class="button secondary" type="button" id="open-variant-dialog" style="margin-top:10px">+ افزودن واریانت جدید</button>{% endif %}<p class="help">نتایج با نام محصول و SKU مشخص می‌شوند. {% if kind != 'variant-image' %}واریانت‌های متصل به سکه یا پک دیگر در جستجو نمایش داده نمی‌شوند.{% endif %}</p>
