<div class="dashboard-card mb-4">
    <div class="p-3 p-md-4 border-bottom d-flex justify-content-between align-items-center gap-3">
        <div><h2 class="h5 mb-1">ویدئوهای محصول</h2><div class="text-secondary small">{{ product.videos.count }} ویدئو</div></div>
        <a href="{% url 'dashboard:product_info_edit' product.pk %}" class="btn btn-sm btn-outline-primary">مدیریت ویدئوها</a>
    </div>
    <div class="p-3 p-md-4">
        {% if product.videos.all %}<div class="row g-3">{% for video in product.videos.all %}<div class="col-12 col-lg-6"><div class="border rounded p-2"><video class="w-100 rounded" controls preload="metadata"><source src="{{ video.video.url }}"></video><div class="small mt-2">{{ video.caption|default:"بدون عنوان" }}</div></div></div>{% endfor %}</div>{% else %}<div class="text-center text-secondary py-4">ویدئویی برای این محصول ثبت نشده است.</div>{% endif %}
    </div>
</div>
