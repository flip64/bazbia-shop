<aside class="dashboard-sidebar" id="dashboardSidebar">

    <div class="sidebar-brand">
        <a href="{% url 'dashboard:home' %}">
            بازبیا
        </a>
    </div>

    <nav class="sidebar-nav">

        <a
            class="
                sidebar-link
                {% if request.resolver_match.url_name == 'home' %}
                    active
                {% endif %}
            "
            href="{% url 'dashboard:home' %}"
        >
            داشبورد
        </a>

        <div class="sidebar-title">
            سفارش‌ها
        </div>

        <a
            class="
                sidebar-link
                {% if request.resolver_match.url_name == 'order_list' %}
                    active
                {% elif request.resolver_match.url_name == 'order_detail' %}
                    active
                {% elif request.resolver_match.url_name == 'order_status_update' %}
                    active
                {% endif %}
            "
            href="{% url 'dashboard:order_list' %}"
        >
            مدیریت سفارش‌ها
        </a>

        <div class="sidebar-title">
            تأمین‌کنندگان
        </div>

        {% for supplier in suppliers %}
            <a
                class="
                    sidebar-link
                    {% if request.resolver_match.url_name == 'supplier_products' %}
                        {% if request.resolver_match.kwargs.slug == supplier.slug %}
                            active
                        {% endif %}
                    {% endif %}
                "
                href="{% url 'dashboard:supplier_products' supplier.slug %}"
            >
                {{ supplier.name }}
            </a>
        {% empty %}
            <span class="sidebar-empty">
                تأمین‌کننده‌ای وجود ندارد
            </span>
        {% endfor %}

    </nav>

</aside>
